name: notes-bot

services:
  bot:
    build: .
    image: notes-bot:latest
    container_name: notes-bot
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      LLM_URL: http://llm:8080
      # nvidia-smi only (for /stats and logs/gpu.csv); no compute access
      NVIDIA_DRIVER_CAPABILITIES: utility
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      # Prompts are re-read on every call: edit bot/prompts/*.md without restarting
      - ./bot/prompts:/app/bot/prompts:ro
    depends_on:
      - llm
    mem_limit: ${BOT_MEM_LIMIT:-512m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    # Same image as the bot, different process: FastAPI + the built web UI
    image: notes-bot:latest
    container_name: notes-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["python", "-m", "uvicorn", "web.api.main:app", "--host", "0.0.0.0", "--port", "8090", "--no-access-log"]
    env_file: .env
    environment:
      LLM_URL: http://llm:8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./bot/prompts:/app/bot/prompts:ro
    ports:
      # Home network (and Tailscale) only: never forward this port on the router
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8090}:8090"
    depends_on:
      - bot
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  llm:
    # Pascal fallback: LLM_IMAGE=notes-llm:pascal, built by scripts/check-gpu.sh from llm/Dockerfile.
    # No build: section here, so `docker compose up --build` only rebuilds the bot.
    image: ${LLM_IMAGE:-ghcr.io/mostlygeek/llama-swap:cuda}
    container_name: notes-llm
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      # JIT cache for PTX compiled to sm_61: without it every model load recompiles the kernels
      CUDA_CACHE_PATH: /cache/cuda
      CUDA_CACHE_MAXSIZE: "4294967296"
    volumes:
      - ./llama-swap.yaml:/app/config.yaml:ro
      - ${MODELS_DIR:-./data/models}:/models:ro
      - ./data/cache/cuda:/cache/cuda
    ports:
      # Not published externally: server localhost only. The bot uses the internal compose network.
      - "127.0.0.1:${LLM_PORT:-9292}:8080"
    mem_limit: ${LLM_MEM_LIMIT:-3g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
